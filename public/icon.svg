<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cylGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="25%" stop-color="#ea580c"/>
      <stop offset="70%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="25%" stop-color="#38bdf8"/>
      <stop offset="55%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background with rounded corners (safe for maskable) -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  
  <!-- Outer subtle circular highlight -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#ea580c" stroke-width="3" stroke-opacity="0.25"/>

  <!-- Top Flame emerging from cylinder -->
  <g transform="translate(0, -10)" filter="url(#glow)">
    <path d="M256 60 C240 100 205 130 220 170 C230 195 250 205 256 205 C262 205 282 195 292 170 C307 130 272 100 256 60 Z" fill="url(#flameGrad)"/>
    <!-- Inner Flame Cone (Blue efficiency flame) -->
    <path d="M256 120 C248 145 238 160 245 185 C250 195 256 198 256 198 C256 198 262 195 267 185 C274 160 264 145 256 120 Z" fill="#38bdf8"/>
    <circle cx="256" cy="180" r="6" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Cylinder Valve Collar Guard Ring -->
  <path d="M220 190 Q256 182 292 190 L296 220 Q256 228 216 220 Z" fill="url(#ringGrad)"/>
  <!-- Brass Valve nozzle -->
  <rect x="248" y="200" width="16" height="24" rx="3" fill="#fbbf24"/>
  <rect x="242" y="206" width="28" height="6" rx="2" fill="#d97706"/>

  <!-- Cylinder Upper Dome -->
  <path d="M176 270 C176 225 210 215 256 215 C302 215 336 225 336 270 Z" fill="url(#cylGrad)"/>

  <!-- Main Cylinder Barrel -->
  <rect x="176" y="265" width="160" height="150" fill="url(#cylGrad)"/>

  <!-- Cylinder Welded Seam Ring 1 -->
  <line x1="176" y1="290" x2="336" y2="290" stroke="#7c2d12" stroke-width="4" stroke-opacity="0.6"/>
  <!-- Cylinder Center Welded Seam Ring 2 -->
  <line x1="176" y1="385" x2="336" y2="385" stroke="#7c2d12" stroke-width="4" stroke-opacity="0.6"/>

  <!-- Cylinder Base Foot Ring -->
  <path d="M176 410 C176 435 205 445 256 445 C307 445 336 435 336 410 Z" fill="url(#cylGrad)"/>
  <path d="M196 440 L196 460 Q256 468 316 460 L316 440 Q256 448 196 440 Z" fill="url(#ringGrad)"/>

  <!-- Brand Label & 19kg Text on Cylinder Body -->
  <rect x="194" y="305" width="124" height="65" rx="8" fill="#0f172a" fill-opacity="0.75" stroke="#fb923c" stroke-width="1.5"/>
  <text x="256" y="328" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" fill="#f8fafc" text-anchor="middle" letter-spacing="1.5">SANDHYA</text>
  <text x="256" y="348" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" fill="#ea580c" text-anchor="middle">19 KG</text>
  <text x="256" y="362" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="0.5">COMMERCIAL LPG</text>
</svg>
